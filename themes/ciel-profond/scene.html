<div class="sky" id="sky" aria-hidden="true">
  <div class="world" id="world">
    <canvas id="bg"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <canvas id="grid"></canvas>
</div>
<div class="shade" aria-hidden="true"></div>
<div class="dim" aria-hidden="true"></div>

<div class="stage" id="stage">
  
  <div class="xh" id="xh"></div><div class="xv" id="xv"></div><div class="mkx" id="mkx"></div><div class="mky" id="mky"></div>

  <section class="hero gut">
    <div class="hero-inner">
      <span class="eyebrow">Codex Mental · Exploration</span>
      <h1>CIEL PROFOND</h1>
      <p class="tags">Explorer · Comprendre · Imaginer</p>
      <p class="lead">Un ciel d'observation où chaque rubrique est un repère à viser. Survolez une région pour la découvrir, cliquez pour y entrer.</p>
    </div>
  </section>

  <button class="node" data-open="atelier" type="button" aria-pressed="false" aria-label="Atelier" style="--x:33%;--y:25%;--mx:9%;--my:54%">
    <span class="hit"></span>
    <svg class="ret" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8"/><circle class="pulse" cx="20" cy="20" r="8"/><path d="M20 3v6M20 31v6M3 20h6M31 20h6"/><circle class="dotc" cx="20" cy="20" r="1.5"/></svg>
    <span class="lbl"><span class="sym"></span><b>Atelier</b><em class="co"></em></span>
  </button>
  <button class="node" data-open="observatoire" type="button" aria-pressed="false" aria-label="Observatoire" style="--x:79%;--y:21%;--mx:9%;--my:61%">
    <span class="hit"></span>
    <svg class="ret" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8"/><circle class="pulse" cx="20" cy="20" r="8"/><path d="M20 3v6M20 31v6M3 20h6M31 20h6"/><circle class="dotc" cx="20" cy="20" r="1.5"/></svg>
    <span class="lbl"><span class="sym"></span><b>Observatoire</b><em class="co"></em></span>
  </button>
  <button class="node" data-open="codex" type="button" aria-pressed="false" aria-label="Codex" style="--x:61.5%;--y:46%;--mx:42%;--my:67.5%">
    <span class="hit"></span>
    <svg class="ret" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8"/><circle class="pulse" cx="20" cy="20" r="8"/><path d="M20 3v6M20 31v6M3 20h6M31 20h6"/><circle class="dotc" cx="20" cy="20" r="1.5"/></svg>
    <span class="lbl"><span class="sym"></span><b>Codex</b><em class="co"></em></span>
  </button>
  <button class="node" data-open="laboratoire" type="button" aria-pressed="false" aria-label="Laboratoire" style="--x:31%;--y:66%;--mx:9%;--my:76%">
    <span class="hit"></span>
    <svg class="ret" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8"/><circle class="pulse" cx="20" cy="20" r="8"/><path d="M20 3v6M20 31v6M3 20h6M31 20h6"/><circle class="dotc" cx="20" cy="20" r="1.5"/></svg>
    <span class="lbl"><span class="sym"></span><b>Laboratoire</b><em class="co"></em></span>
  </button>
  <button class="node" data-open="portrait" type="button" aria-pressed="false" aria-label="Portrait" style="--x:72%;--y:72%;--mx:42%;--my:83%">
    <span class="hit"></span>
    <svg class="ret" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8"/><circle class="pulse" cx="20" cy="20" r="8"/><path d="M20 3v6M20 31v6M3 20h6M31 20h6"/><circle class="dotc" cx="20" cy="20" r="1.5"/></svg>
    <span class="lbl"><span class="sym"></span><b>Portrait</b><em class="co"></em></span>
  </button>

  <div class="evt" id="evt" hidden><b id="evt-id">SN 2026a</b><em>Supernova détectée · simulation</em></div>


  <div class="scalebar" aria-hidden="true"><span class="ln" id="sb-line"></span><span>30′</span></div>

  <footer class="dock gut">
    <button class="card nebula" id="nebula" type="button" aria-label="Changer de région du ciel">
      <canvas class="thumb" id="nebula-thumb" width="128" height="96"></canvas>
      <span><span class="t" id="nebula-t">Nébuleuse des Idées</span><span class="s" id="nebula-s">Région de formation des concepts</span></span>
    </button>

    <div class="dock-r">
      <div class="readout" id="readout">
        <span class="id">NGC · CODEX 01</span>
        <span class="sky-co" id="rd-sky"></span>
        <span id="rd-fov"></span>
        <span id="rd-sim"></span>
      </div>
      <div class="labwrap">
        <div class="pop" id="pop" hidden>
          <div>
            <span class="lbl">Filtre</span>
            <div class="swatches" role="radiogroup" aria-label="Filtre d'observation">
              <button class="fsw" role="radio" type="button" data-f="visible" aria-checked="true" title="Lumière visible, couleurs naturelles">Visible</button>
              <button class="fsw" role="radio" type="button" data-f="infrarouge" aria-checked="false" title="La poussière apparaît lumineuse">Infrarouge</button>
              <button class="fsw" role="radio" type="button" data-f="hubble" aria-checked="false" title="Fausses couleurs de type Hubble">Hubble</button>
            </div>
          </div>
          <div>
            <label class="lbl" for="speed">Rotation de la galaxie</label>
            <input id="speed" type="range" min="0" max="3" step="0.1" value="1">
          </div>
          <label class="row" for="gridchk"><span>Grille et règles</span><input id="gridchk" type="checkbox" checked></label>
          <label class="row" for="comets"><span>Météores et supernovae</span><input id="comets" type="checkbox" checked></label>
        </div>
        <button class="card labcard" id="lab" type="button" aria-expanded="false" aria-controls="pop">
          <svg class="ic" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 001.3 2h11.4A1.5 1.5 0 0019 19l-5-10V3"/><path d="M7.5 15h9"/></svg>
          <span><span class="t">Laboratoire de la galaxie</span><span class="s">Filtres et personnalisation</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span>
        </button>
      </div>
    </div>
  </footer>
</div>
